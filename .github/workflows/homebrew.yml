name: Update Homebrew tap

# Regenerates Formula/recall.rb in the tap repo from the release's checksums, so
# `brew install void-restack/tap/recall` (and `brew upgrade`) tracks each release.
#
# One-time setup by the maintainer:
#   1. Create a public repo `void-restack/homebrew-tap` with `Formula/recall.rb`
#      (any valid stub — this workflow overwrites it on the first release).
#   2. Create a PAT with Contents:read+write on that tap repo and add it to THIS repo
#      as the secret `HOMEBREW_TAP_TOKEN` (GITHUB_TOKEN cannot push cross-repo).

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v0.1.0"
        required: true

permissions:
  contents: read

jobs:
  update-formula:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag/version
        id: v
        run: |
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          echo "tag=$TAG"         >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Download checksums from the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "${{ steps.v.outputs.tag }}" \
            --repo void-restack/recall \
            --pattern '*.sha256' \
            --dir checksums

      - name: Checkout tap
        uses: actions/checkout@v7
        with:
          repository: void-restack/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Regenerate Formula/recall.rb
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          h() { cut -d' ' -f1 "checksums/recall-v${VERSION}-$1.sha256"; }
          MAC_ARM=$(h aarch64-apple-darwin)
          MAC_X86=$(h x86_64-apple-darwin)
          LIN_ARM=$(h aarch64-unknown-linux-musl)
          LIN_X86=$(h x86_64-unknown-linux-musl)
          mkdir -p tap/Formula
          cat > tap/Formula/recall.rb <<EOF
          class Recall < Formula
            desc "Fast, local command memory for your terminal"
            homepage "https://github.com/void-restack/recall"
            version "${VERSION}"
            license "MIT"

            on_macos do
              on_arm do
                url "https://github.com/void-restack/recall/releases/download/v#{version}/recall-v#{version}-aarch64-apple-darwin.tar.gz"
                sha256 "${MAC_ARM}"
              end
              on_intel do
                url "https://github.com/void-restack/recall/releases/download/v#{version}/recall-v#{version}-x86_64-apple-darwin.tar.gz"
                sha256 "${MAC_X86}"
              end
            end

            on_linux do
              on_arm do
                url "https://github.com/void-restack/recall/releases/download/v#{version}/recall-v#{version}-aarch64-unknown-linux-musl.tar.gz"
                sha256 "${LIN_ARM}"
              end
              on_intel do
                url "https://github.com/void-restack/recall/releases/download/v#{version}/recall-v#{version}-x86_64-unknown-linux-musl.tar.gz"
                sha256 "${LIN_X86}"
              end
            end

            def install
              bin.install "recall"
            end

            test do
              assert_match "recall", shell_output("#{bin}/recall --version")
            end
          end
          EOF

      - name: Commit and push
        run: |
          cd tap
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/recall.rb
          git commit -m "recall ${{ steps.v.outputs.version }}" || { echo "no change"; exit 0; }
          git push
